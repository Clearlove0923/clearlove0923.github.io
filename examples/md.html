<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档变可分享网页 · 示例</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css?v=20261002004415">
  <style>
    .demo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 24px;
      background: #1f2328;
      color: #d8dee6;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .demo-bar a { color: #85b7eb; }
    .demo-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: calc(100vh - 44px); }
    .demo-pane { padding: 20px 24px; overflow: auto; }
    .demo-pane.left { background: #f6f7f9; border-right: 1px solid var(--line); }
    textarea.md-input {
      width: 100%;
      height: calc(100vh - 260px);
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: Consolas, Menlo, monospace;
      font-size: 13px;
      line-height: 1.7;
      resize: vertical;
      background: #fff;
    }
    .pane-actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    .tip { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .render h1 { font-size: 26px; margin: 0 0 8px; }
    .render h2 { font-size: 20px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .render h3 { font-size: 16px; margin: 18px 0 6px; }
    .render p, .render li { color: #4b5563; }
    .render code { padding: 2px 6px; background: #f1efe8; border-radius: 4px; font-size: 13px; }
    .render pre { padding: 12px; background: #1f2328; color: #d8dee6; border-radius: 8px; overflow-x: auto; }
    .render pre code { background: none; color: inherit; padding: 0; }
    .render table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
    .render th, .render td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
    .toc-box {
      padding: 12px 16px; margin-bottom: 20px;
      background: #f6f7f9; border: 1px solid var(--line); border-radius: 8px;
    }
    .toc-box strong { display: block; margin-bottom: 6px; font-size: 13px; }
    .toc-box a { display: block; font-size: 13.5px; padding: 2px 0; }
    .hint-empty { color: var(--muted); font-size: 14px; }
    @media (max-width: 860px) {
      .demo-wrap { grid-template-columns: 1fr; }
      .demo-pane.left { border-right: none; border-bottom: 1px solid var(--line); }
      textarea.md-input { height: 220px; }
    }
  </style>
</head>
<body>

  <div class="demo-bar">
    <span>示例 · 上传 .md / .docx / .pdf，渲染为带目录的可分享网页</span>
    <span><a href="../index.html">← 返回主站</a></span>
  </div>

  <div class="demo-wrap">
    <div class="demo-pane left">
      <strong style="display:block;margin-bottom:10px;">原文（解析后可继续编辑）</strong>
      <textarea class="md-input" id="mdInput" spellcheck="false"></textarea>
      <div class="pane-actions">
        <input type="file" id="fileInput" accept=".md,.markdown,.txt,.docx,.pdf">
        <button class="btn btn-primary" id="renderBtn">渲染</button>
        <button class="btn btn-outline" id="copyBtn">复制分享链接</button>
        <span class="muted" style="font-size:12px;" id="status"></span>
      </div>
      <p class="tip">
        支持 Markdown（.md / .markdown）、纯文本（.txt）、Word（.docx）、PDF（.pdf）。<br>
        解析全部在你的浏览器内完成，<strong>文件不会上传到任何服务器</strong>。
      </p>
    </div>

    <div class="demo-pane">
      <div class="render" id="render"><p class="hint-empty">右侧将显示渲染后的网页效果。</p></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    var SAMPLE = [
      '# 鸣潮 接入 Steam 配置说明',
      '',
      '> 本页由 Markdown 文件自动生成，带目录，可直接分享链接。',
      '',
      '## 准备工作',
      '',
      '- Windows 10 / 11（x64）',
      '- 已安装 Steam 客户端并登录',
      '- Steam 库中已入库该游戏',
      '- 本地已安装国服游戏本体',
      '',
      '## 配置步骤',
      '',
      '1. 打开 SteamCN-GameLauncher',
      '2. 在预设区域选择游戏，或填入 AppID 自动获取信息',
      '3. 选择真实的游戏 EXE / 启动器位置',
      '4. 点击保存，回到 Steam 库启动',
      '',
      '## 一键更新',
      '',
      '在预设区域点击「一键更新」，助手会重新获取元数据：',
      '',
      '- 优先沿用当前仍有效的 Depot 与占位 EXE',
      '- 剩余候选唯一时自动切换，多个候选需手动选择',
      '- 原 ACF 备份到 `backups\\<AppID>`，最多 2 份、最长 30 天',
      '',
      '## 常见问题',
      '',
      '### 启动后没有时长记录',
      '',
      '确认是从 Steam 库内启动，且 Steam 处于在线状态。',
      '',
      '### 覆盖层无法呼出',
      '',
      '检查 Steam 设置中的「游戏中启用 Steam 界面」是否开启。'
    ].join('\n');

    var input = document.getElementById('mdInput');
    var out = document.getElementById('render');
    var status = document.getElementById('status');

    var MAMMOTH = 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
    var PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    var PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    input.value = SAMPLE;

    function slug(text) {
      return text.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '') || 'sec';
    }

    function render() {
      var src = input.value;
      var html = (typeof marked !== 'undefined') ? marked.parse(src) : fallback(src);
      var tmp = document.createElement('div');
      tmp.innerHTML = html;

      var heads = tmp.querySelectorAll('h2, h3');
      var toc = '';
      if (heads.length) {
        toc = '<div class="toc-box"><strong>目录</strong>';
        heads.forEach(function (h) {
          var id = slug(h.textContent);
          h.setAttribute('id', id);
          toc += '<a href="#' + id + '"' + (h.tagName === 'H3' ? ' style="padding-left:14px"' : '') + '>' + h.textContent + '</a>';
        });
        toc += '</div>';
      }
      out.innerHTML = toc + tmp.innerHTML;
      status.textContent = '已渲染 · ' + src.length + ' 字符';
    }

    function fallback(src) {
      var esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return '<pre>' + esc + '</pre>';
    }

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = function () { reject(new Error('依赖加载失败，请检查网络')); };
        document.head.appendChild(s);
      });
    }

    function inlineMd(node) {
      var s = '';
      Array.prototype.forEach.call(node.childNodes, function (n) {
        if (n.nodeType === 3) { s += n.nodeValue; return; }
        if (n.nodeType !== 1) return;
        var t = n.tagName.toLowerCase();
        if (t === 'strong' || t === 'b') s += '**' + inlineMd(n) + '**';
        else if (t === 'em' || t === 'i') s += '*' + inlineMd(n) + '*';
        else if (t === 'code') s += '`' + n.textContent + '`';
        else if (t === 'a') s += '[' + inlineMd(n) + '](' + (n.getAttribute('href') || '') + ')';
        else if (t === 'br') s += '\n';
        else s += inlineMd(n);
      });
      return s;
    }

    function blockMd(el, out) {
      var t = el.tagName.toLowerCase();
      if (/^h[1-6]$/.test(t)) {
        var lv = parseInt(t.charAt(1), 10);
        out.push(new Array(lv + 1).join('#') + ' ' + inlineMd(el).trim(), '');
        return;
      }
      if (t === 'p') {
        var s = inlineMd(el).trim();
        if (s) out.push(s, '');
        return;
      }
      if (t === 'ul' || t === 'ol') {
        Array.prototype.forEach.call(el.children, function (li) {
          if (li.tagName.toLowerCase() !== 'li') return;
          out.push('- ' + inlineMd(li).trim());
        });
        out.push('');
        return;
      }
      if (t === 'blockquote') { out.push('> ' + inlineMd(el).trim(), ''); return; }
      if (t === 'pre') { out.push('```', el.textContent, '```', ''); return; }
      if (t === 'table') {
        var rows = el.querySelectorAll('tr');
        var md = [];
        Array.prototype.forEach.call(rows, function (tr, i) {
          var cells = tr.querySelectorAll('td,th');
          var vals = Array.prototype.map.call(cells, function (c) {
            return inlineMd(c).trim().replace(/\|/g, '\\|');
          });
          md.push('| ' + vals.join(' | ') + ' |');
          if (i === 0) md.push('| ' + vals.map(function () { return '---'; }).join(' | ') + ' |');
        });
        out.push.apply(out, md);
        out.push('');
        return;
      }
      Array.prototype.forEach.call(el.children, function (c) { blockMd(c, out); });
    }

    function htmlToMarkdown(html) {
      var d = document.createElement('div');
      d.innerHTML = html;
      var buf = [];
      Array.prototype.forEach.call(d.children, function (el) { blockMd(el, buf); });
      return buf.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    function readTextFile(file) {
      var reader = new FileReader();
      reader.onload = function (e) {
        input.value = e.target.result;
        render();
        status.textContent = '已载入：' + file.name;
      };
      reader.readAsText(file, 'utf-8');
    }

    function readDocx(file) {
      return loadScript(MAMMOTH)
        .then(function () { return file.arrayBuffer(); })
        .then(function (buf) { return mammoth.convertToHtml({ arrayBuffer: buf }); })
        .then(function (res) {
          input.value = htmlToMarkdown(res.value) || '（文档中没有解析出文本内容）';
          render();
          status.textContent = '已载入：' + file.name + '（Word）';
        });
    }

    function readPdf(file) {
      return loadScript(PDFJS)
        .then(function () {
          pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
          return file.arrayBuffer();
        })
        .then(function (buf) {
          return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        })
        .then(function (pdf) {
          var md = ['# ' + file.name.replace(/\.pdf$/i, ''), ''];
          var chain = Promise.resolve();
          for (var i = 1; i <= pdf.numPages; i++) {
            (function (pageNo) {
              chain = chain.then(function () {
                return pdf.getPage(pageNo).then(function (page) {
                  return page.getTextContent().then(function (tc) {
                    var text = '';
                    tc.items.forEach(function (it) {
                      text += it.str;
                      if (it.hasEOL) text += '\n';
                    });
                    md.push('## 第 ' + pageNo + ' 页', '');
                    md.push(text.trim(), '');
                  });
                });
              });
            })(i);
          }
          return chain.then(function () {
            input.value = md.join('\n');
            render();
            status.textContent = '已载入：' + file.name + '（PDF · ' + pdf.numPages + ' 页）';
          });
        });
    }

    function handleFile(file) {
      var name = file.name.toLowerCase();
      status.textContent = '正在解析…';
      var job;
      if (/\.(md|markdown|txt)$/.test(name)) {
        readTextFile(file);
        return;
      } else if (/\.docx$/.test(name)) {
        job = readDocx(file);
      } else if (/\.pdf$/.test(name)) {
        job = readPdf(file);
      } else {
        status.textContent = '暂不支持该格式';
        return;
      }
      job.catch(function (err) {
        status.textContent = '解析失败：' + (err && err.message ? err.message : err);
      });
    }

    document.getElementById('renderBtn').addEventListener('click', render);
    document.getElementById('fileInput').addEventListener('change', function (e) {
      if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
      e.target.value = '';
    });
    document.getElementById('copyBtn').addEventListener('click', function () {
      var url = location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () { status.textContent = '链接已复制：' + url; });
      } else {
        status.textContent = '分享链接：' + url;
      }
    });

    render();
  </script>

</body>
</html>
