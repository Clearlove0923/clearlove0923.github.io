<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vite + React 构建产物 · 示例</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0f1319;
      --panel: #171c24;
      --line: #262d38;
      --text: #e6e9ef;
      --muted: #98a2b3;
      --accent: #5ea8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    .demo-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 24px; background: #000; color: #98a2b3; font-size: 13px; flex-wrap: wrap;
    }
    .demo-bar a { color: var(--accent); }
    .wrap { max-width: 880px; margin: 0 auto; padding: 40px 24px 72px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .sub { margin: 0 0 32px; color: var(--muted); font-size: 14px; }
    .panel {
      padding: 24px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px;
    }
    .counter { display: flex; align-items: center; gap: 18px; }
    .count { font-size: 40px; font-weight: 600; min-width: 80px; text-align: center; }
    button {
      padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line);
      background: #20262f; color: var(--text); font-size: 14px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #08111d; border-color: transparent; font-weight: 600; }
    ul.tasks { list-style: none; margin: 14px 0 0; padding: 0; }
    ul.tasks li {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px;
    }
    ul.tasks li:last-child { border-bottom: none; }
    ul.tasks li.done span { text-decoration: line-through; color: var(--muted); }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      background: rgba(94, 168, 255, 0.15); color: var(--accent); font-size: 12px;
    }
    code { font-family: Consolas, Menlo, monospace; font-size: 13px; }
    pre {
      margin: 0; padding: 14px 16px; background: #0b0e13; border: 1px solid var(--line);
      border-radius: 8px; overflow-x: auto; color: #c9d1d9;
    }
    .footer-note { margin-top: 32px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

  <div class="demo-bar">
    <span>示例 · Vite + React 构建产物（dist 打包后发布）</span>
    <span><a href="../index.html">← 返回主站</a></span>
  </div>

  <div class="wrap">
    <h1>任务面板 <span class="badge">Vite + React</span></h1>
    <p class="sub">这是一个前端项目的构建产物示例，用于演示打包后发布成网页的效果。</p>

    <div class="panel">
      <strong>计数器</strong>
      <div class="counter" style="margin-top:14px;">
        <button id="dec">−</button>
        <div class="count" id="count">0</div>
        <button id="inc">+</button>
        <button class="primary" id="reset">重置</button>
      </div>
    </div>

    <div class="panel">
      <strong>今日任务</strong>
      <ul class="tasks" id="tasks">
        <li><input type="checkbox"> <span>安装 SteamCN-GameLauncher</span></li>
        <li><input type="checkbox"> <span>选择鸣潮并自动获取信息</span></li>
        <li><input type="checkbox"> <span>在 Steam 库中启动一次</span></li>
        <li><input type="checkbox"> <span>确认时长记录正常</span></li>
      </ul>
    </div>

    <div class="panel">
      <strong>它是怎么发布上来的</strong>
      <pre style="margin-top:12px;"><code>cd my-app &amp;&amp; npm run build
# 把 dist 目录打包后发布，即得一个可分享链接</code></pre>
    </div>

    <p class="footer-note">
      本页为静态示例，交互由页面脚本直接实现，不依赖后端服务。
    </p>
  </div>

  <script>
    var n = 0, el = document.getElementById('count');
    document.getElementById('inc').onclick = function () { el.textContent = ++n; };
    document.getElementById('dec').onclick = function () { el.textContent = --n; };
    document.getElementById('reset').onclick = function () { n = 0; el.textContent = n; };
    document.getElementById('tasks').addEventListener('change', function (e) {
      if (e.target.tagName === 'INPUT') e.target.parentElement.classList.toggle('done', e.target.checked);
    });
  </script>

</body>
</html>
